# papercusp-agentic-desktop-app — template #1 (scope: app). P-022 (owner #5): the
# agentic app is a LAYER — it requires the non-agentic papercusp-desktop-app as its
# BASE app (whose closure brings papercusp-tauri-desktop-shell + papercusp-data-layer +
# papercusp-ui) and adds papercusp-ops-hives, the judgment plane, on top
# (P-014: one app = many templates). Machine twin: @papercusp/template-kit
# src/reference-templates.ts AGENTIC_DESKTOP_APP_TEMPLATE — the kit's suite
# pins this file to it.
id: papercusp-agentic-desktop-app
version: "0.1.0"
scope: app
category: app
summary: >-
  The proven two-plane agentic desktop app shape:
  papercusp-ops-hives (judgment plane + the ONE seam) layered onto the
  non-agentic papercusp-desktop-app BASE template — whose requires-closure brings the
  papercusp-tauri-desktop-shell chassis, papercusp-data-layer, and papercusp-ui — plus
  glue guidance. An app built from this composition must pass the UNION of
  the full closure's checks — that additive rule is what keeps free-form
  composition safe without a deterministic composer.
components: []
contracts: []
decisionPoints:
  - id: domain
    prompt: >-
      What is the app's domain — the noun the deterministic plane ledgers and
      the judgment plane reasons about? Drives every aspect-level decision
      point.
composesWith:
  - papercusp-desktop-app
  - papercusp-ops-hives
# P-015: HARD pinned deps. P-022 re-layered: papercusp-desktop-app is the required BASE
# app (a base app joins the composition without owning it — composeTemplates'
# root-app rule) and pulls the whole chassis + data + UI closure;
# papercusp-ops-hives adds the judgment plane. The checks union covers the
# full closure.
requires:
  - { id: papercusp-desktop-app, version: 0.1.0 }
  - { id: papercusp-ops-hives, version: 0.1.0 }
docs:
  - agent-insights/templates-system-design
  - agent-insights/templates-template-yaml
checks:
  - id: composition-integrity
    run: checks/composition-integrity.test.ts
    summary: >-
      the composed set resolves (composeTemplates ok: pins consistent, one
      root app scope) and the union of checks is what CI runs
musts:
  - id: walk-decision-points
    rule: "Answer EVERY decision point of the closure — the answers are the ship disclosure that makes free composition reviewable (domain is answered once)"
    enforcedBy: prose-only
  - id: honor-closure-musts
    rule: "Honor every closure member MUST tiers in full — the seam discipline is Tier B, the chassis invariants keep it bootable"
    enforcedBy: prose-only
  - id: mechanical-validation
    rule: "Expand through resolveRequiresClosure, compose through composeTemplates, and run the union of checks as the CI gate"
    enforcedBy: composition-integrity
