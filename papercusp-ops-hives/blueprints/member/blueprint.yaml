# {{SEAM_WORK_ITEM_KIND}} — STARTER member blueprint (papercusp-ops-hives
# template): the per-item pipeline the -ops hive's Queen places.
#
# Building agent: replace every {{…}} token while walking the template's
# decision points. The STRUCTURE — director-drives-one-worker spine, work-item
# in/out payloads through YOUR contracts package, judge acceptance,
# depth-over-fan-out, read+propose confinement — is the proven
# purchase-research/bet-analysis shape and SHOULD survive your edits.
# Exemplar: quartermaster/blueprints/purchase-research/blueprint.yaml.
id: "{{SEAM_WORK_ITEM_KIND}}"
extends: research
version: 0.1.0
description: >-
  Process ONE {{WORK_UNIT_DESCRIPTION e.g. sheet item to source}} and emit a
  calibrated {{CONTRACT_NAME}}. A director drives a single worker per
  {{SEAM_WORK_ITEM_KIND}} work-item; output is a {{CONTRACT_NAME}}
  (work-item-payload) the app ingests through its parse gate. Repo-less.

# The work unit (the blueprint declares the work-item TYPE; instances +
# lifecycle live in the `work_items` substrate). Decision points:
# seam-work-item-kind + contract-shape.
workItem:
  kind: "{{SEAM_WORK_ITEM_KIND}}"
  idPrefix: "{{ID_PREFIX e.g. PR}}"
  payload:
    in: "{{INPUT_TYPE}} { {{INPUT_FIELDS}} } — what the sidecar enqueues (your contracts package, wire-validated)"
    out: "{{CONTRACT_NAME}} — what the worker completes with; the app ingests it into {{APP_TABLE}} through parse{{CONTRACT_NAME}}"

# Output seam: the deliverable is the contract payload persisted on the
# work-item — NOT a repo commit. The worker never acts on the world.
output:
  kind: work-item-payload

# "Done" = a judge verdict against the domain rubric (no test suite for
# judgment work). Score the dimensions that make YOUR output trustworthy.
acceptance:
  kind: judge
  rubric:
    dimensions:
      "{{DIMENSION_1 e.g. itemMatch}}": "{{What does a genuine match mean in your domain, including the variant/edge specifics that distinguish a near-miss?}}"
      "{{DIMENSION_2 e.g. evidenceLiveness}}": "{{Is every proposal's evidence real and currently verifiable (live link, reachable source)?}}"
      "{{DIMENSION_3 e.g. valueAccuracy}}": "{{Do the numeric/value fields reflect what the evidence actually shows, honoring declared input constraints?}}"
    weights:
      "{{DIMENSION_1}}": 0.45
      "{{DIMENSION_2}}": 0.3
      "{{DIMENSION_3}}": 0.25

# Depth over fan-out: one item at a time per spawned harness; the -ops hive
# fans WIDTH across items by placing many member harnesses, never by raising
# this.
dispatch:
  concurrency: 1

spine:
  decider: "{{DOMAIN}}-director"
  maxTurns: 20
  default: { to: idle }
  edges:
    DONE: { to: done }
    ESCALATE: { to: escalate, reasonFrom: arg }
    IDLE: { to: idle }
    NEXT_WORKER: { to: role, role: "{{DOMAIN}}-worker", extras: ["FEATURE_ID={feature}"] }

planner:
  kind: inline

roles:
  - id: "{{DOMAIN}}-director"
    description: Per-item orchestrator; emits the next verb (work / done / escalate).
    prompt: >-
      You are the director for ONE {{SEAM_WORK_ITEM_KIND}} work-item. You do
      NOT do the domain work yourself — you read state and emit EXACTLY ONE
      control verb per turn, driving the worker to a calibrated
      {{CONTRACT_NAME}}.

      Read the work-item first (work_items:get on FEATURE_ID): the
      {{INPUT_TYPE}} payload and any draft the worker checkpointed.

      Then choose: ESCALATE <reason> when the input cannot be processed safely
      (missing/invalid payload, self-contradictory constraints — never let a
      bad input become output); NEXT_WORKER to produce or refine the
      {{CONTRACT_NAME}} (again if the worker checkpointed that it needs
      another pass); DONE once the worker completed with an internally
      consistent {{CONTRACT_NAME}} (the join key echoes the input; every
      declared constraint honored; an empty result carries notes); IDLE when
      there is nothing to advance.

      You and the worker are {{SAFE_CAPABILITY_CLASS}}. Nothing you do ever
      {{DANGEROUS_ACTIONS}} — downstream deterministic code (strictly after
      any human gate) consumes the output.
    tools:
      - work_items:get
      - work_items:list
  - id: "{{DOMAIN}}-worker"
    description: "Processes one {{WORK_UNIT_DESCRIPTION}} into a calibrated {{CONTRACT_NAME}}."
    capabilities: ["{{SAFE_CAPABILITIES e.g. web:read}}", "work_items:propose"]
    prompt: >-
      You are a {{APP_NAME}} {{DOMAIN}}-worker. You are handed ONE
      {{WORK_UNIT_DESCRIPTION}} (work_items:get on FEATURE_ID gives the
      {{INPUT_TYPE}} payload). Produce a ranked, calibrated {{CONTRACT_NAME}}.

      Method ({{adapt to your domain — this is the proven quartermaster
      shape}}): (1) read the input + constraints closely for variant/edge
      specifics — a near-miss is not a match; (2) gather evidence adaptively
      (never one-shot), recalling prior work via memory:search; (3) VERIFY
      every claim against evidence you actually read — never guess a value
      you have not seen; (4) reject anything violating a declared constraint
      — do not propose it at low confidence; (5) set confidence in [0,1] from
      match precision; (6) write a concrete rationale + at least one source
      per proposal — never unexplained or sourceless.

      If nothing qualifies, return an EMPTY result with concrete notes on what
      was tried and why nothing qualified — never fabricate to avoid empty.

      Emit ONLY a {{CONTRACT_NAME}} via work_items:complete, passing it as
      `outputPayload` (alongside the structured `completion` record). It must
      match your contracts package EXACTLY — the sidecar's ONLY gate between
      your output and the {{APP_TABLE}} table is parse{{CONTRACT_NAME}}; a
      payload that fails it never reaches the app.

      HARD RULES: you are {{SAFE_CAPABILITY_CLASS}}. You NEVER
      {{DANGEROUS_ACTIONS}}. No proposal without a rationale + source you
      actually read. If you cannot verify, leave it out — checkpoint why and
      let the director decide.
    tools:
      - work_items:get
      - work_items:checkpoint
      - work_items:complete
      - search:semantic
      - search:fulltext
      - memory:search
      - fetch_plus:fetch_clean
      - capability:fetch

reactive: []

# Gym trace = the work-item output + transcript, NOT a git diff — a repo-less
# harness has no diff to collect.
gym:
  collectTrace: work-item-output
  signals: []

knobs:
  harnessKind: "{{SEAM_WORK_ITEM_KIND}}"
  requiresRepo: false

# Confinement (blueprints/README.md, inviolable): every role above is READ +
# PROPOSE-ONLY via its declared `capabilities:`. The -ops hive install applies
# the enforced capability envelope across every hive role.
dependencies:
  tools:
    - work_items:get
    - work_items:list
    - work_items:checkpoint
    - work_items:complete
    - search:semantic
    - search:fulltext
    - memory:search
    - fetch_plus:fetch_clean
