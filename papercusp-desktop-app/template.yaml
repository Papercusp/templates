# papercusp-desktop-app — 'Papercusp Official: Desktop App' (scope: app, category: app;
# owner directive 2026-07-04 #4 / P-021). A WHOLE desktop app WITHOUT agent
# orchestration: a THIN pure composition pulling papercusp-tauri-desktop-shell +
# papercusp-data-layer + papercusp-ui via hard requires. The agentic app
# template re-layers on top of this (owner #5 / P-022). Machine twin:
# @papercusp/template-kit src/reference-templates.ts DESKTOP_APP_TEMPLATE —
# the kit's suite pins this file to it.
id: papercusp-desktop-app
version: "0.1.0"
scope: app
category: app
summary: >-
  A whole papercusp-style desktop app with NO agent orchestration: the
  papercusp-tauri-desktop-shell chassis (thin Tauri host → Node/Hono sidecar → release
  pipeline) + papercusp-data-layer (app-owned embedded Postgres, connection
  discovery, typed-contract write gates) + papercusp-ui (headless primitives,
  data grids, dock workbench, brand lexicon), pulled in as hard requires. A
  thin pure composition — no own components; an app built from it must pass
  the UNION of the closure's checks. Need agents? Use papercusp-agentic-desktop-app,
  which layers the judgment plane on top of this.
components: []
contracts: []
decisionPoints:
  - id: domain
    prompt: >-
      What is the app's domain — the noun its data layer ledgers and its UI
      surfaces? Drives every aspect-level decision point (schema, searchable
      surfaces, panels, lexicon terms).
  - id: optional-planes
    prompt: >-
      Beyond the required closure, does the app need live UI state sync
      (compose papercusp-data-sync) or search over its data (compose
      papercusp-search)? Add them to the composition now if so — both are
      designed to drop onto this chassis.
composesWith:
  - papercusp-tauri-desktop-shell
  - papercusp-data-layer
  - papercusp-ui
  - papercusp-data-sync
  - papercusp-search
# P-015: HARD pinned deps — composing/installing this app template pulls the
# whole chassis+data+ui closure in; the checks union covers the closure.
requires:
  - { id: papercusp-tauri-desktop-shell, version: 0.1.0 }
  - { id: papercusp-data-layer, version: 0.1.0 }
  - { id: papercusp-ui, version: 0.1.0 }
docs:
  - agent-insights/templates-system-design
  - agent-insights/templates-template-yaml
checks:
  - id: composition-integrity
    run: checks/composition-integrity.test.ts
    summary: >-
      the composed set resolves (composeTemplates ok: pins consistent, one
      root app scope) and the union of checks is what CI runs
musts:
  - id: thin-app-template
    rule: "The app template adds glue guidance and decision points, never its own components — capability belongs in aspects"
    enforcedBy: composition-integrity
  - id: full-union-green
    rule: "The composed app passes the FULL union of the closure checks — boot-e2e, components-integrated, composition-integrity"
    enforcedBy: prose-only
  - id: no-agent-surfaces
    rule: "No hives and no seam in an app built from this template — if agents appear mid-build, switch the composition root to papercusp-agentic-desktop-app"
    enforcedBy: prose-only
