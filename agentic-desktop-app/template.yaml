# agentic-desktop-app — template #1 (scope: app). A THIN pure composition of
# papercusp-ops-hives + tauri-desktop-shell (P-014: one app = many templates).
# Machine twin: @papercusp/template-kit src/reference-templates.ts
# AGENTIC_DESKTOP_APP_TEMPLATE — the kit's suite pins this file to it.
id: agentic-desktop-app
version: "0.1.0"
scope: app
category: app
summary: >-
  The two-plane agentic desktop app quartermaster and oddsmith instantiate:
  papercusp-ops-hives (judgment plane + the ONE seam) composed onto
  tauri-desktop-shell (the deterministic chassis), plus glue guidance. An app
  built from this composition must pass the UNION of both aspects' checks —
  that additive rule is what keeps free-form composition safe without a
  deterministic composer.
components: []
contracts: []
decisionPoints:
  - id: domain
    prompt: >-
      What is the app's domain — the noun the deterministic plane ledgers and
      the judgment plane reasons about? Drives every aspect-level decision
      point.
composesWith:
  - papercusp-ops-hives
  - tauri-desktop-shell
# P-015: HARD pinned deps — composing/installing this app template pulls both
# aspects in; the checks union covers the closure. (P-022 re-layers onto the
# non-agentic desktop-app template once it exists.)
requires:
  - { id: papercusp-ops-hives, version: 0.1.0 }
  - { id: tauri-desktop-shell, version: 0.1.0 }
docs:
  - agent-insights/templates-system-design
  - agent-insights/templates-template-yaml
checks:
  - id: composition-integrity
    run: checks/composition-integrity.test.ts
    summary: >-
      the composed set resolves (composeTemplates ok: pins consistent, one app
      scope) and the union of checks is what CI runs
