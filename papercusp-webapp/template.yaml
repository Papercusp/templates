# papercusp-webapp — 'Papercusp Official: Web App' (scope: app, category:
# app; owner directive 2026-07-05 / P-030). What desktop-app is to the
# desktop this is to the browser: a THIN pure composition swapping the tauri
# chassis for papercusp-web-host; data + UI closure identical. Machine twin:
# @papercusp/template-kit src/reference-templates.ts
# PAPERCUSP_WEBAPP_TEMPLATE — the kit's suite pins this file to it.
id: papercusp-webapp
version: "0.1.0"
scope: app
category: app
summary: >-
  A whole papercusp-style WEB app — what desktop-app is to the desktop, this
  is to the browser (extracted from the Restart webapp, the first papercusp
  project): the papercusp-web-host chassis (Next.js standalone host, auth
  seam, deploy skeleton) + papercusp-data-layer (app-owned Postgres,
  connection discovery, typed-contract write gates) + papercusp-ui (headless
  primitives, data grids, dock workbench, brand lexicon), pulled in as hard
  requires. A thin pure composition — no own components; an app built from
  it must pass the UNION of the closure's checks. No agent plane here; an
  agentic web app layers papercusp-ops-hives onto this the way
  agentic-desktop-app layers onto desktop-app.
components: []
contracts: []
decisionPoints:
  - id: domain
    prompt: >-
      What is the app's domain — the noun its data layer ledgers and its UI
      surfaces? Drives every aspect-level decision point (schema, searchable
      surfaces, panels, lexicon terms).
  - id: tenancy
    prompt: >-
      Single-user local install (papercusp-style, embedded PG per install)
      or multi-user server deployment (one PG, real auth, sessions)? The web
      chassis serves both, but auth-strategy, data-layer connection
      resolution, and the hosting target all fork on this answer — decide it
      FIRST.
  - id: optional-planes
    prompt: >-
      Beyond the required closure, does the app need live UI state sync
      (compose papercusp-data-sync) or search over its data (compose
      papercusp-search)? Add them to the composition now if so — both are
      designed to drop onto this chassis.
composesWith:
  - papercusp-web-host
  - papercusp-data-layer
  - papercusp-ui
  - papercusp-data-sync
  - papercusp-search
# P-015: HARD pinned deps — composing/installing this app template pulls the
# web chassis + data + UI closure in; the checks union covers the closure.
requires:
  - { id: papercusp-web-host, version: 0.1.0 }
  - { id: papercusp-data-layer, version: 0.1.0 }
  - { id: papercusp-ui, version: 0.1.0 }
docs:
  - agent-insights/templates-system-design
  - agent-insights/templates-template-yaml
  - agent-insights/restart-webapp-audit-papercusp-webapp-template
checks:
  - id: composition-integrity
    run: checks/composition-integrity.test.ts
    summary: >-
      the composed set resolves (composeTemplates ok: pins consistent, one
      root app scope) and the union of checks is what CI runs
